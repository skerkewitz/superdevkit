# Steinschlag's project file (superdevkit.toml, ADR-6F3CJZBY): superdevkit build snes makes the
# ROM, superdevkit run plays it on the desktop.
name = "steinschlag"
kit = "../.."                 # the kit's repository, which this example is part of
sources = ["src"]

[graphics]
tiles = [
    "assets/cave_a_gfx.png", "assets/cave_b_gfx.png", "assets/cave_c_gfx.png",
    "assets/miner_gfx.png", "assets/font_gfx.png",
]

[sound]
sfx = "assets/sfx/sfx.json"   # the sound effects (docs/sound.md)
