# Schach's project file (superdevkit.toml, ADR record 31): superdevkit build snes makes the ROM,
# superdevkit run plays it on the desktop.
name = "schach"
kit = "../.."                 # the kit's repository, which this example is part of
sources = ["src"]

[graphics]
tiles = ["assets/board_gfx.png", "assets/sprites_gfx.png", "assets/font_gfx.png"]

[sound]
sfx = "assets/sfx/sfx.json"   # the sound effects (docs/sound.md)
