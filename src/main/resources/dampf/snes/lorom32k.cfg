# ld65 memory map for a 32 KB LoROM (larger ROMs come later). See docs/memory-map.md.
#
# RAM: bank $7E. The data bank register is $7E all the time, so 16-bit absolute addresses reach
# all of it. Its first 8 KB are the same memory as $0000-$1FFF in bank 0, where the direct page
# and the stack live. RAM addresses are given without the bank ($2000, not $7E2000).
# ROM: bank 0, $8000-$FFFF; generated code reads ROM data with 24-bit addresses.
MEMORY {
    DP:    start = $0000, size = $0100, type = rw;                # direct page (D = 0)
    #      $0100-$1DFF: free for now; $1E00-$1FFF: stack (S starts at $1FFF)
    RAM:   start = $2000, size = $E000, type = rw;                # $7E2000-$7EFFFF: variables
    ROM:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = DP,  type = zp,  optional = yes;
    BSS:      load = RAM, type = bss, define = yes, optional = yes;
    DATA:     load = ROM, run = RAM,  type = rw, define = yes, optional = yes;
    STARTUP:  load = ROM, type = ro;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro,  optional = yes;
    HEADER:   load = ROM, type = ro,  start = $FFC0;
    VECTORS:  load = ROM, type = ro,  start = $FFE0;
}
