# ld65 memory map for a 32 KB LoROM (milestone M1; larger ROMs come later).
# Bank 0: WRAM mirror $0000-$1FFF, ROM $8000-$FFFF.
MEMORY {
    DP:    start = $0000, size = $0100, type = rw;                # direct page (D = 0)
    RAM:   start = $0100, size = $1D00, type = rw;                # globals and static frames
    #      $1E00-$1FFF: stack (S starts at $1FFF)
    ROM:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = DP,  type = zp,  optional = yes;
    BSS:      load = RAM, type = bss, define = yes, optional = yes;
    DATA:     load = ROM, run = RAM,  type = rw, define = yes, optional = yes;
    STARTUP:  load = ROM, type = ro;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro,  optional = yes;
    HEADER:   load = ROM, type = ro,  start = $FFC0;
    VECTORS:  load = ROM, type = ro,  start = $FFE0;
}
